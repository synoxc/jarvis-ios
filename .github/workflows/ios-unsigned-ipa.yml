# Gera um .ipa iOS NÃO ASSINADO num runner macOS (GitHub Actions)
# para depois assinares no Windows com Sideloadly/AltStore + Apple ID grátis.
#
# Como usar:
#   1. git add . && git commit && git push para o GitHub
#      (o prebuild corre no runner macOS — no Windows o Expo
#      recusa gerar a pasta ios/)
#   2. separador Actions > "iOS unsigned IPA" > Run workflow
#   4. sacar o artefacto jarvis-ios-unsigned.ipa
#   5. no Windows: Sideloadly ou AltStore > instalar com o teu Apple ID
#   6. renovar de 7 em 7 dias (AltStore faz sozinha no mesmo Wi-Fi)
#
# Limites reais da conta Apple GRÁTIS:
#   - a app expira ao fim de 7 dias, máximo 3 apps sideloaded
#   - entitlements pagos (HealthKit, App Groups, Push, widgets com
#     extensions) SÃO REMOVIDOS antes de compilar — ver passo
#     "strip-paid-entitlements". Sem isto o xcodebuild falha ou o
#     Sideloadly rejeita. Consequência: ecrã Fitness/Health fica
#     degradado nesta build; microfone, Face ID, câmara QR e áudio
#     em background funcionam.
name: iOS unsigned IPA

"on":
  workflow_dispatch:

jobs:
  build:
    # Expo SDK 57 (expo-modules-jsi 57.1.x) SÓ compila com Swift 6.3+,
    # ou seja Xcode >= 26.4 (expo/expo#49214): em Xcode 26.2/26.3 o
    # RuntimeScheduler.h dá "SWIFT_RETURNS_RETAINED ... cannot be annotated"
    # (hard error) e o JavaScriptRuntime.swift dá "sending 'resultPtr' risks
    # data races". A imagem macos-15 só vai até Xcode 26.3; a macos-26 traz
    # 26.6 (default) / 26.5 / 26.4.1. Xcode >= 26.4 também satisfaz o
    # swift-tools-version 6.2 do SPM local expo-modules-jsi/apple (o default
    # do macos-15, Xcode 16.4 = Swift 6.1, nem sequer resolvia o pacote).
    runs-on: macos-26
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Selecionar Xcode 26.4+ (Swift 6.3, Expo SDK 57)
        run: |
          set -euo pipefail
          echo "Xcodes disponíveis:"
          ls -d /Applications/Xcode*.app || true
          XCODE=$( (ls -d /Applications/Xcode_26*.app 2>/dev/null || true) | sort | tail -n 1 )
          if [ -z "$XCODE" ] || [ ! -d "$XCODE" ]; then
            echo "::error::Nenhum Xcode 26.x encontrado no runner."
            exit 1
          fi
          sudo xcode-select -s "$XCODE"
          echo "Selecionado: $XCODE"
          xcodebuild -version
          swift --version
          VER=$(xcodebuild -version | awk '/^Xcode/{print $2}')
          case "$VER" in
            26.0*|26.1*|26.2*|26.3*)
              echo "::error::Xcode $VER < 26.4 — Expo SDK 57 exige Swift 6.3 (expo/expo#49214)."
              exit 1
              ;;
          esac

      - name: Setup Node 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install JS deps
        run: npm ci

      - name: Expo prebuild (gera/atualiza ios/)
        run: npx expo prebuild --platform ios

      # Modulo nativo manual: o prebuild nao conhece ios/JarvisHealth,
      # por isso copia-se de modules/ para dentro do projeto gerado.
      - name: Restore JarvisHealth native module
        run: |
          mkdir -p ios/JarvisHealth
          cp modules/jarvis-health/ios/JarvisHealth.swift ios/JarvisHealth/
          cp modules/jarvis-health/ios/JarvisHealth.podspec ios/JarvisHealth/
          ls ios/JarvisHealth/

      - name: Setup Ruby + CocoaPods
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.2"
          bundler-cache: true
          working-directory: ios

      - name: Pod install
        working-directory: ios
        run: pod install --repo-update

      # Conta Apple GRÁTIS não assina estes entitlements. Removê-los
      # evita falha de compilação e rejeição no Sideloadly/AltStore.
      - name: Strip paid entitlements (HealthKit/App Groups/Push/widgets)
        run: |
          python3 - <<'EOF'
          import glob, re
          paid = [
              'com.apple.developer.healthkit',
              'com.apple.developer.healthkit.access',
              'com.apple.developer.healthkit.background-delivery',
              'com.apple.security.application-groups',
              'aps-environment',
          ]
          for f in glob.glob('ios/**/*.entitlements', recursive=True):
              src = open(f).read()
              for key in paid:
                  # remove a linha <key>...</key> e o valor seguinte (<true/>, <array>, <string>)
                  src = re.sub(
                      r'\s*<key>' + re.escape(key) + r'</key>\s*(<true\s*/>|<false\s*/>|<string>.*?</string>|<array>.*?</array>)',
                      '',
                      src,
                      flags=re.DOTALL,
                  )
              open(f, 'w').write(src)
              print('stripped:', f)
          EOF

      - name: Build .app sem assinatura
        working-directory: ios
        run: |
          WS=$(ls -d *.xcworkspace | head -n 1)
          SCHEME=$(basename "$WS" .xcworkspace)
          xcodebuild \
            -workspace "$WS" \
            -scheme "$SCHEME" \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            AD_HOC_CODE_SIGNING_ALLOWED=YES

      - name: Empacotar .ipa (Payload/)
        run: |
          APP=$(find ios/build/Build/Products/Release-iphoneos -maxdepth 1 -name "*.app" | head -n 1)
          echo "APP=$APP"
          rm -rf Payload jarvis-ios-unsigned.ipa
          mkdir Payload
          cp -R "$APP" Payload/
          zip -r jarvis-ios-unsigned.ipa Payload

      - name: Upload artefacto
        uses: actions/upload-artifact@v4
        with:
          name: jarvis-ios-unsigned
          path: jarvis-ios-unsigned.ipa
